[target.riscv32im-risc0-zkvm-elf]
# 与 risc0-build encode_rust_flags 一致,但只在 riscv32im-risc0-zkvm-elf target 生效,
# 不污染宿主 build script(risc0-build 通过 CARGO_ENCODED_RUSTFLAGS 全局注入,
# 在 cargo 1.98 下会误伤 build script;target 专属 rustflags 无此问题)。
rustflags = [
    "-C", "passes=lower-atomic",
    "-C", "link-arg=-Ttext=0x00200800",
    "-C", "link-arg=--fatal-warnings",
    "-C", "panic=abort",
    "--cfg", "getrandom_backend=\"custom\"",
]
