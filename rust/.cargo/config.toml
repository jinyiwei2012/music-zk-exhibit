# rust/.cargo/config.toml - Windows 原生构建配置
#
# /STACK:Windows 主线程栈默认仅 1 MiB(PE 头),而 risc0 CPU prover 的
# zirgen C++ poly_fp 是 20~57 层深递归巨帧,主线程(也参与 rayon par_iter
# 内联执行)会栈溢出。加大主线程栈 reserve 到 64 MiB。
# (Linux/macOS 主线程 8 MiB 默认足够,无需配置)
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/STACK:0x4000000"]

[target.x86_64-pc-windows-gnu]
rustflags = ["-C", "link-arg=-Wl,--stack,67108864"]

# CARGO_TARGET_DIR 指向 ASCII 路径:仓库根目录含 CJK("非AI音乐的零知识证明"),
# nvcc 链接器阶段(cl.exe LINK)对非 ASCII 路径编码错乱,报 LNK1104
# (sppark 的 cuda_available GPU 探测编译,2026-09-01 实测)。
# 注意:必须用 [build] target-dir(cargo 核心配置),[env] 段不影响 cargo 自身路径。
[build]
target-dir = "C:/music-zk-target"
