[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "music-zk"
version = "0.1.0"
description = "Music-ZK Exhibit —— 非AI音乐的零知识证明(概念展品):验证私有 MIDI 承诺打开与参考合成对应"
requires-python = ">=3.12"
license = { text = "MIT OR Apache-2.0" }
dependencies = [
    "pynacl>=1.5",   # Ed25519(Phase 3 SPEC §10.1)
    "jcs>=0.2.1",    # RFC 8785 JCS(Phase 3 SPEC §10.2,与 Rust serde_jcs 对拍)
    "httpx>=0.27",   # CLI 客户端(Phase 3 SPEC §13)
]

[project.scripts]
music-zk = "music_zk.cli.main:main"

[project.optional-dependencies]
server = [
    "fastapi>=0.115",      # Phase 3 SPEC §14 服务端
    "uvicorn>=0.30",       # 本地运行 demo server
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
include = ["music_zk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
